version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: salesforce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesforce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  go-app:
    image: ghcr.io/brenonfon/frontlead-lab:latest
    container_name: frontlead_go_app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SF_CONSUMER_KEY=${SF_CONSUMER_KEY}
      - SF_CONSUMER_SECRET=${SF_CONSUMER_SECRET}
      - HS_API_KEY=${HS_API_KEY}
    networks:
      - app-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true
      - REPO_USER=${GITHUB_USERNAME}
      - REPO_PASS=${GITHUB_TOKEN}
    command: --interval 300 --cleanup --label-enable
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
